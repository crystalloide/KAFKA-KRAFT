# =============================================================================
#  /etc/security/limits.d/kafka.conf - Limites par utilisateur (sessions PAM)
#  Kafka ouvre un descripteur par segment de log et par connexion : >= 100 000
# =============================================================================
*    soft    nofile    100000
*    hard    nofile    100000
*    soft    nproc     65536
*    hard    nproc     65536
